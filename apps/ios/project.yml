# Xcode project definition. Generate Drivex.xcodeproj with:  xcodegen generate
# (brew install xcodegen). The .xcodeproj is not committed: this file is the source.
name: Drivex
options:
  bundleIdPrefix: com.drivex
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"

targets:
  Drivex:
    type: application
    platform: iOS
    sources:
      - path: Drivex
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drivex.app
        PRODUCT_NAME: Drivex
        INFOPLIST_FILE: Drivex/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DRIVEX_TEAM_ID)
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: Supabase

  DrivexTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DrivexTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drivex.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Drivex.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Drivex
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: Drivex

schemes:
  Drivex:
    build:
      targets:
        Drivex: all
        DrivexTests: [test]
    test:
      targets:
        - DrivexTests
