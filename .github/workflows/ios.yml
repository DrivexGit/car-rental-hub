name: iOS app

# Builds the iPhone app (apps/ios) and runs its unit tests on a Mac runner, so the Swift code is checked
# on every push that touches it, even from a Windows machine.
on:
  push:
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and test on the simulator
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          xcodebuild test \
            -project Drivex.xcodeproj -scheme Drivex \
            -destination "id=$DEVICE" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*deprecated|Test Suite|Executed|BUILD|\*\*" || true
          grep -q "TEST SUCCEEDED" build.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: apps/ios/build.log
